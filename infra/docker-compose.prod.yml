# Production di VM (gedklin.my.id). Dijalankan dari /opt/gedklin dengan:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# Image dibuild oleh GitHub Actions (workflow Deploy) dan ditarik dari GHCR.
# Batas memori disetel untuk VM 1 GB RAM + 2 GB swap.
name: gedklin

x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://gedklin:${POSTGRES_PASSWORD}@db:5432/gedklin
  REDIS_URL: redis://redis:6379/0
  CELERY_TASK_ALWAYS_EAGER: "false"
  # Dipakai bila WA_PROVIDER=openwa (service openwa di bawah).
  OPENWA_URL: http://openwa:2785

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@gedklin.my.id}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    depends_on:
      - web
      - api

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gedklin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: gedklin
    command: >
      postgres -c shared_buffers=64MB -c effective_cache_size=192MB
      -c work_mem=2MB -c maintenance_work_mem=32MB -c max_connections=30
    # Hanya localhost VM: akses dari PC lewat SSH tunnel, tidak terbuka ke internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gedklin"]
      interval: 10s
      retries: 10
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 48mb --maxmemory-policy noeviction
    mem_limit: 64m

  api:
    image: ghcr.io/nikiramandika/gedklin-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment: *api-env
    # Migrasi + seed idempoten (katalog hanya diisi bila kosong, owner hanya dibuat bila belum ada).
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
      --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 400m

  worker:
    image: ghcr.io/nikiramandika/gedklin-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment: *api-env
    # Worker + beat dalam satu proses, 1 slot, supaya hemat RAM.
    command: >
      celery -A app.workers worker -B --concurrency=1 --loglevel=info
      -s /tmp/celerybeat-schedule
    depends_on:
      - api
    mem_limit: 400m

  web:
    image: ghcr.io/nikiramandika/gedklin-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 256m

  # Gateway WhatsApp (github.com/rmyndharis/OpenWA). Hanya jalan bila .env VM berisi
  # COMPOSE_PROFILES=wa. Engine Baileys (tanpa Chromium) supaya muat di VM 1 GB.
  # Dashboard hanya di localhost VM: buka lewat SSH tunnel (ssh -L 2785:localhost:2785 ...).
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.30.3
    profiles: [wa]
    restart: unless-stopped
    stop_grace_period: 75s
    environment:
      NODE_ENV: production
      TZ: Asia/Jakarta
      PORT: "2785"
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      ENGINE_TYPE: baileys
      # Key admin pertama = WA_API_KEY Gedklin (diabaikan bila key sudah pernah dibuat).
      API_MASTER_KEY: ${WA_API_KEY:-}
      # Session tersambung lagi sendiri setelah container restart/deploy.
      AUTO_START_SESSIONS: "true"
      # Default Baileys membuat HP laundry tidak berbunyi selama gateway tersambung.
      BAILEYS_MARK_ONLINE_ON_CONNECT: "false"
      BAILEYS_SYNC_FULL_HISTORY: "false"
      # Pemanasan nomor: kuota harian naik bertahap (20, 40, 80, ...); lewat batas -> HTTP 429.
      SEND_PACING_ENABLED: "true"
      SIMULATE_TYPING: "true"
      # Dashboard dibuka lewat SSH tunnel (http://localhost), bukan HTTPS; tanpa ini tampil kosong.
      CSP_UPGRADE_INSECURE_REQUESTS: "false"
    ports:
      - "127.0.0.1:2785:2785"
    volumes:
      # Login WhatsApp, API key, dan database OpenWA. Hilang = scan QR ulang.
      - openwa_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    mem_limit: 320m

volumes:
  pgdata:
  openwa_data:
  caddy_data:
  caddy_config:
