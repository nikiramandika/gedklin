name: Deploy

# Jalan otomatis setelah CI di main sukses, atau manual dari tab Actions.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/nikiramandika
  TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  API_URL: https://api.gedklin.my.id

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/gedklin-api:${{ env.TAG }}
            ${{ env.REGISTRY }}/gedklin-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          build-args: NEXT_PUBLIC_API_URL=${{ env.API_URL }}
          tags: |
            ${{ env.REGISTRY }}/gedklin-web:${{ env.TAG }}
            ${{ env.REGISTRY }}/gedklin-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Siapkan SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Salin file infra ke VM
        run: >
          scp -i ~/.ssh/deploy infra/docker-compose.prod.yml infra/Caddyfile infra/backup.sh
          ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/gedklin/
      - name: Tarik image & restart service
        run: |
          ssh -i ~/.ssh/deploy ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "IMAGE_TAG=$TAG GHCR_USER=${{ github.actor }} GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }} sh -s" <<'EOF'
          set -eu
          cd /opt/gedklin
          chmod +x backup.sh
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -f
          EOF
      - name: Cek kesehatan
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "API tidak sehat setelah deploy" && exit 1
